name: Check image URLs
on:
  workflow_dispatch:
  push:
    paths: [app.js, .github/workflows/check-images.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify external artwork images
        run: |
          python3 - <<'PY'
          import re, urllib.request, concurrent.futures
          source=open('app.js', encoding='utf-8').read()
          urls=list(dict.fromkeys(re.findall(r"'(photo-[a-zA-Z0-9-]+)'", source)))
          def check(u):
              url='https://images.unsplash.com/'+u+'?w=80&q=20'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              try:
                  with urllib.request.urlopen(req, timeout=16) as r:
                      return u, r.status, r.headers.get('Content-Type','')
              except Exception as e:
                  return u, 'FAIL', str(e)
          with concurrent.futures.ThreadPoolExecutor(max_workers=9) as ex:
              results=list(ex.map(check,urls))
          failures=[v for v in results if v[1]!=200 or not v[2].startswith('image/')]
          print('Checked unique image URLs:',len(urls))
          print('Working:',len(urls)-len(failures))
          for v in failures: print('FAILED:',v[0],v[1],v[2])
          if failures: raise SystemExit(1)
          PY